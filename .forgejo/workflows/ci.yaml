name: CI, Quality & GitOps Cascade

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  check-and-test:
    name: "Rust — Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Rust Toolchain"
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: "Configure Sovereign Lumen Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          cat <<'EOF' > "$HOME/.cargo/config.toml"
[registries.lumen]
index = "sparse+https://git.2lp.in/api/packages/lumen/cargo/"
EOF
          if [ -n "${{ secrets.LUMEN_REGISTRY_TOKEN }}" ]; then
            cat <<EOF > "$HOME/.cargo/credentials.toml"
[registries.lumen]
token = "${{ secrets.LUMEN_REGISTRY_TOKEN }}"
EOF
          fi

      - name: "GitOps — Update Sovereign Satellite Dependencies"
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "-> GitOps dispatch recebido: atualizando crates satelites a partir do registry lumen..."
          cargo update -p joaju-csv -p joaju-table -p joaju-pedigree -p joaju-unfurl || cargo update
          if ! git diff --quiet Cargo.lock; then
            echo "-> Alteracoes detectadas em Cargo.lock. Commitando..."
            git config user.name "Lumen Pink (Baquara)"
            git config user.email "hi@lumen.pink"
            git commit -m "chore(deps): atualizar dependencias do registry lumen [skip ci]"
            if [ -n "${{ secrets.CODEBERG_TOKEN }}" ]; then
              git push "https://x-access-token:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/lumenpink/joaju.git" main || true
            fi
          else
            echo "-> Nenhuma alteracao em Cargo.lock detectada."
          fi

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        run: cargo test

      - name: "Audit GitOps Cascade Integration"
        run: bash tests/audit_gitops_cascade.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict
          fi

  publish-and-cascade:
    name: "Publish Sovereign Crate & Cascade Downstream"
    runs-on: ubuntu-latest
    needs: [check-and-test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Configure Sovereign Lumen Cargo Credentials"
        env:
          LUMEN_TOKEN: ${{ secrets.LUMEN_REGISTRY_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          cat <<'EOF' > "$HOME/.cargo/config.toml"
[registries.lumen]
index = "sparse+https://git.2lp.in/api/packages/lumen/cargo/"
EOF
          if [ -n "$LUMEN_TOKEN" ]; then
            cat <<EOF > "$HOME/.cargo/credentials.toml"
[registries.lumen]
token = "$LUMEN_TOKEN"
EOF
          fi

      - name: "Publish Crate to Sovereign Lumen Registry"
        run: |
          echo "-> Publicando joaju no registry lumen..."
          cargo publish --registry lumen || echo "::warning::Versao ja publicada ou falha tolerada no registry."

      - name: "GitOps Cascade — Dispatch Downstream joaju-web"
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -n "$CODEBERG_TOKEN" ]; then
            echo "-> Notificando consumidor downstream (joaju-web)..."
            curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              "https://codeberg.org/api/v1/repos/lumenpink/joaju-web/actions/workflows/ci.yaml/dispatches" \
              -d '{"ref": "main"}' || true
            echo "✔ Disparo enviado para joaju-web com sucesso."
          else
            echo "CODEBERG_TOKEN ausente, pulando disparo downstream."
          fi
