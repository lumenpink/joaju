name: "CI / CD Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: "Run Test Suite & Quality Gates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Install Dependencies (Hermetic Lockfile)"
        run: |
          npm ci

      - name: "Audit Dependencies (Anti-Vulnerability)"
        run: |
          npm audit --audit-level=high

      - name: "Lint & Code Quality (Biome Zero Warnings)"
        run: |
          npm run lint

      - name: "Run Unit Test Suite"
        run: |
          npm test

      - name: "Code Coverage Gate (>= 90%)"
        run: |
          npm run test:coverage

      - name: "Validate Docker Compose"
        run: |
          docker compose config

      - name: "Validate GOST Quality Standards"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp gost check
          fi
