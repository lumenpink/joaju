services:
  # 1. Container principal (Compilador + R + Typst + Node.js)
  joaju:
    build: .
    container_name: joaju
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    networks:
      - joaju_net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3000/healthz\", (r) => process.exit(r.statusCode === 200 ? 0 : 1))' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - kroki

  # 2. Gateway do Kroki (encaminha requisições gráficas)
  kroki:
    image: yuzutech/kroki:0.32.1
    container_name: kroki_gateway
    restart: unless-stopped
    environment:
      - KROKI_MERMAID_HOST=kroki-mermaid
      - KROKI_MERMAID_PORT=8002
    networks:
      - joaju_net
    depends_on:
      - kroki-mermaid

  # 3. Renderizador isolado do Mermaid (Chromium headless)
  kroki-mermaid:
    image: yuzutech/kroki-mermaid:0.32.1
    container_name: kroki_mermaid
    restart: unless-stopped
    networks:
      - joaju_net

networks:
  joaju_net:
    driver: bridge
