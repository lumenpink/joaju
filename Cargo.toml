[package]
name = "joaju"
version = "0.1.0"
edition = "2021"
description = "A scientific academic compiler and typographical orchestrator in Rust for Typst, clinical pedigrees, and tables"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/joaju"
homepage = "https://codeberg.org/lumenpink/joaju"
documentation = "https://docs.rs/joaju"
readme = "README.md"
keywords = ["typst", "compiler", "academic", "typesetting", "markdown"]
categories = ["compilers", "text-processing", "command-line-utilities", "science"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[lib]
name = "joaju"
path = "src/lib.rs"

[[bin]]
name = "joaju"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
joaju-pedigree = { version = "0.2.0", registry = "lumen" }
joaju-csv = { version = "0.1.0", registry = "lumen" }
joaju-table = { version = "0.1.0", registry = "lumen" }
joaju-unfurl = { version = "0.1.0", registry = "lumen" }
joaju-lirica = { version = "0.1.0", registry = "lumen" }
joaju-slides = { version = "0.2.0", registry = "lumen" }
regex = "1"
chematic-smiles = "1.1"
chematic-depict = { version = "1.1", default-features = false }
typst-as-lib = { version = "0.17", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.22"
base64 = "0.22"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

