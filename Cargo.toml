[package]
name = "joaju"
version = "0.2.0-dev.1"
edition = "2021"
description = "Orquestrador tipográfico acadêmico e compilador científico nativo em Rust"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/joaju"
homepage = "https://codeberg.org/lumenpink/joaju"
documentation = "https://docs.rs/joaju"
readme = "README.md"
keywords = ["typst", "compiler", "academic", "typesetting", "markdown"]
categories = ["compilers", "text-processing", "command-line-utilities", "web-programming"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[lib]
name = "joaju"
path = "src/lib.rs"

[[bin]]
name = "joaju"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pedigree-rs = { version = "0.1.0-dev.1", path = "../pedigree-rs" }
ssot-rs = { version = "0.1.0-dev.1", path = "../ssot-rs" }
table-rs = { version = "0.1.0-dev.1", path = "../table-rs" }
unfurl-rs = { version = "0.1.0-dev.1", path = "../unfurl-rs" }
regex = "1"
chematic-smiles = "1.1"
chematic-depict = { version = "1.1", default-features = false }
typst-as-lib = { version = "0.17", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.22"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
