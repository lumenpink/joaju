[package]
name = "joaju"
version = "0.2.0-dev.137"
edition = "2021"
description = "A scientific academic compiler and typographical orchestrator in Rust for Typst, clinical pedigrees, and tables"
license = "Apache-2.0"
repository = "https://gambi.2lp.in/lumen/joaju"
homepage = "https://gambi.2lp.in/lumen/joaju"
documentation = "https://docs.rs/joaju"
readme = "README.md"
keywords = ["typst", "compiler", "academic", "typesetting", "markdown"]
categories = ["compilers", "text-processing", "command-line-utilities", "science"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[lib]
name = "joaju"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "joaju"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
joaju-pedigree = { version = "=0.2.0-dev.96", registry = "gambi" }
joaju-table = { version = "=0.2.0-dev.56", registry = "gambi" }
joaju-markdown = { version = "=0.0.2-dev.30", registry = "gambi" }
joaju-templates = { version = "=0.0.2-dev.31", registry = "gambi" }
joaju-lirica = { version = "=0.5.1-dev.31", registry = "gambi" }
joaju-slides = { version = "=0.1.0-dev.42", registry = "gambi" }
joaju-wireframe = { version = "=0.1.0-dev.27", registry = "gambi" }
joaju-sequence = { version = "=0.1.0-dev.32", registry = "gambi" }
joaju-graph = { version = "=0.1.0-dev.31", registry = "gambi" }
regex = "1"
joaju-chem = { version = "=0.1.0-dev.65", registry = "gambi" }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
