[package]
name = "joaju"
version = "0.1.0"
edition = "2021"
description = "A scientific academic compiler and typographical orchestrator in Rust for Typst, clinical pedigrees, and tables"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/joaju"
homepage = "https://codeberg.org/lumenpink/joaju"
documentation = "https://docs.rs/joaju"
readme = "README.md"
keywords = ["typst", "compiler", "academic", "typesetting", "markdown"]
categories = ["compilers", "text-processing", "command-line-utilities", "science"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[lib]
name = "joaju"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "joaju"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
joaju-pedigree = { version = "0.2.0", registry = "gambi" }
joaju-csv = { version = "0.1.0", registry = "gambi" }
joaju-table = { version = "0.1.0", registry = "gambi" }
joaju-lirica = { version = "0.1.0", registry = "gambi" }
joaju-slides = { version = "0.2.0", registry = "gambi" }
regex = "1"
joaju-chem = { version = "0.1.0", registry = "gambi" }
typst-as-lib = { version = "0.17", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
