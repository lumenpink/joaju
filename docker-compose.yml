version: '3.8'

services:
  # 1. Nosso container principal (Compilador + R + Typst + Node.js)
  joaju:
    build: .
    container_name: joaju
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mapeia a sua pasta local com: template.typ, referencias.bib, abnt.csl
      - ./data:/data
    networks:
      - joaju_net
    depends_on:
      - kroki

  # 2. Gateway do Kroki (encaminha requisições gráficas)
  kroki:
    image: yuzutech/kroki:0.24.0
    container_name: kroki_gateway
    restart: unless-stopped
    environment:
      # Diz ao gateway onde está o renderizador Mermaid irmão
      - KROKI_MERMAID_HOST=kroki-mermaid
      - KROKI_MERMAID_PORT=8002
    networks:
      - joaju_net
    depends_on:
      - kroki-mermaid

  # 3. Renderizador isolado do Mermaid (Chromium headless)
  kroki-mermaid:
    image: yuzutech/kroki-mermaid:0.24.0
    container_name: kroki_mermaid
    restart: unless-stopped
    networks:
      - joaju_net

networks:
  joaju_net:
    driver: bridge
