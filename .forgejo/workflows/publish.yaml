name: Publish to Crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      - name: Verify GOST Compliance
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict
          fi
      - name: Run Tests
        run: |
          cargo test --all-targets
          cargo test --doc
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cargo publish
