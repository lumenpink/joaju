name: "CI/CD & Canonical Release to Banca"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: "Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Canonical Gambi Cargo Registry"
        env:
          TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN || secrets.REGISTRY_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          printf '[registries.lumen]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' >> "$HOME/.cargo/config.toml"
          if [ -n "$TOKEN" ]; then
            RAW_TOKEN="${TOKEN#Bearer }"
            printf '[registries.gambi]\ntoken = "Bearer %s"\n[registries.lumen]\ntoken = "Bearer %s"\n' "$RAW_TOKEN" "$RAW_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Ensure Toolchain Components"
        run: rustup component add rustfmt clippy 2>/dev/null || true

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        run: cargo test --all-targets

      - name: "Validate Canonical Banca Pipeline Test"
        run: bash tests/test_banca_pipeline_canonical.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-banca:
    name: "Build & Publish Joaju Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Release Channel and Version"
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            VERSION="${REF#refs/tags/v}"
          else
            CHANNEL="nightly"
            BASE_VER=$(head -n 1 VERSION 2>/dev/null | cut -d'+' -f1 | tr -d ' \r\n' || echo "0.1.0-dev")
            GIT_SHA=$(git rev-parse --short HEAD)
            DATE_STAMP=$(date +%Y%m%d)
            VERSION="${BASE_VER}+${DATE_STAMP}.${GIT_SHA}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "★ Canal: $CHANNEL | Versão: $VERSION"

      - name: "Configure Canonical Gambi Cargo Registry"
        env:
          TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN || secrets.REGISTRY_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          printf '[registries.lumen]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' >> "$HOME/.cargo/config.toml"
          if [ -n "$TOKEN" ]; then
            RAW_TOKEN="${TOKEN#Bearer }"
            printf '[registries.gambi]\ntoken = "Bearer %s"\n[registries.lumen]\ntoken = "Bearer %s"\n' "$RAW_TOKEN" "$RAW_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Ensure Toolchain Components"
        run: rustup component add rustfmt clippy 2>/dev/null || true

      - name: "Compile Joaju Multiarch Binaries"
        run: |
          echo "★ [1/3] Compilando x86_64-unknown-linux-musl (Linux AMD64)..."
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p joaju || \
            cargo build --release --target x86_64-unknown-linux-musl -p joaju

          echo "★ [2/3] Compilando aarch64-unknown-linux-musl (Linux ARM64)..."
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p joaju || \
            cargo build --release --target aarch64-unknown-linux-musl -p joaju

          echo "★ [3/3] Compilando x86_64-pc-windows-gnu (Windows AMD64)..."
          cargo zigbuild --release --target x86_64-pc-windows-gnu -p joaju || \
            cargo build --release --target x86_64-pc-windows-gnu -p joaju

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          # 1. Empacotar Linux AMD64
          if [ -d target/x86_64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/joaju-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release joaju \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/joaju-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release joaju
          fi

          # 2. Empacotar Linux ARM64
          if [ -d target/aarch64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/joaju-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release joaju \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/joaju-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release joaju
          fi

          # 3. Empacotar Windows AMD64
          if [ -d target/x86_64-pc-windows-gnu/release ]; then
            cd target/x86_64-pc-windows-gnu/release
            zip -j "$GITHUB_WORKSPACE/dist/packages/joaju-${VERSION}-windows-amd64.zip" \
              joaju.exe "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/joaju-${VERSION}-windows-amd64.zip" \
              joaju.exe
            cd "$GITHUB_WORKSPACE"
          fi

          cd dist/packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Publish Multiarch Staticlibs to Forgejo Generic Packages"
        env:
          TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN || secrets.REGISTRY_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          RAW_TOKEN="${TOKEN#Bearer }"
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::Token canônico ausente para Generic Packages!"
            exit 1
          fi

          VERSION="${{ steps.meta.outputs.version }}"
          BASE_VERSION=$(head -n 1 VERSION | cut -d'+' -f1 | tr -d ' \r\n')

          TARGETS=(
            "x86_64-unknown-linux-musl:libjoaju-x86_64-linux.a"
            "aarch64-unknown-linux-musl:libjoaju-aarch64-linux.a"
            "x86_64-pc-windows-gnu:libjoaju-x86_64-windows.a"
          )

          for ENTRY in "${TARGETS[@]}"; do
            IFS=":" read -r TARGET DEST_NAME <<< "$ENTRY"
            SRC_PATH="target/${TARGET}/release/libjoaju.a"
            if [ -f "$SRC_PATH" ]; then
              echo "-> Enviando $DEST_NAME para Generic Packages na versão exata ($VERSION)..."
              curl -s -f --http1.1 --retry 3 -X PUT \
                -H "Authorization: token $RAW_TOKEN" \
                -T "$SRC_PATH" \
                "https://gambi.2lp.in/api/packages/lumen/generic/joaju-static/${VERSION}/${DEST_NAME}"

              if [ "$VERSION" != "$BASE_VERSION" ]; then
                echo "-> Disponibilizando $DEST_NAME sob o alias base ($BASE_VERSION)..."
                curl -s -f --http1.1 --retry 3 -X PUT \
                  -H "Authorization: token $RAW_TOKEN" \
                  -T "$SRC_PATH" \
                  "https://gambi.2lp.in/api/packages/lumen/generic/joaju-static/${BASE_VERSION}/${DEST_NAME}"
              fi
              echo "✔ $DEST_NAME publicado."
            else
              echo "::error::Arquivo $SRC_PATH nao encontrado para publicacao!"
              exit 1
            fi
          done

      - name: "Notify Kombinat Cascade"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          echo "Notifying Kombinat cascade daemon..."
          curl -s -X POST http://127.0.0.1:4040/api/cascade/dispatch \
            -H "Content-Type: application/json" \
            -d "{\"package\": \"joaju\", \"version\": \"${VERSION}\"}" || echo "Kombinat notification skipped or unreachable."

      - name: "Upload Artifacts to Cloudflare R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          echo "★ Enviando pacotes para o Cloudflare R2 (twolp-bucket / bucket.2lp.in)..."
          for PKG in dist/packages/*; do
            [ -f "$PKG" ] || continue
            PKG_NAME=$(basename "$PKG")
            npx wrangler r2 object put "twolp-bucket/downloads/joaju/${CHANNEL}/${PKG_NAME}" \
              --file="$PKG" --remote || true
          done

      - name: "Rotate Manifest & Commit to Banca"
        env:
          TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN || secrets.FORGEJO_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RAW_TOKEN="${TOKEN#Bearer }"
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VERSION="${{ steps.meta.outputs.version }}"

          echo "★ Clonando repositório canônico da Banca para rotação e retenção..."
          git clone --depth 1 "https://lumen:${RAW_TOKEN}@gambi.2lp.in/lumen/banca.git" /tmp/banca

          if [ -d "/tmp/banca/site/downloads/joaju" ] && [ -f "/tmp/banca/scripts/rotate-downloads.py" ]; then
            cd /tmp/banca

            # Registrar cada uma das arquiteturas
            for ARCH in "linux-amd64" "linux-arm64" "windows-amd64"; do
              EXT="tar.gz"
              [ "$ARCH" = "windows-amd64" ] && EXT="zip"
              PKG_FILE="joaju-${VERSION}-${ARCH}.${EXT}"

              HASH=$(grep "$PKG_FILE" "$GITHUB_WORKSPACE/dist/packages/SHA256SUMS" | awk '{print $1}' || echo "")
              DOWNLOAD_URL="https://bucket.2lp.in/downloads/joaju/${CHANNEL}/${PKG_FILE}"

              python3 scripts/rotate-downloads.py \
                --manifest site/downloads/joaju/index.json \
                --channel "${CHANNEL}" \
                --arch "${ARCH}" \
                --version-str "${VERSION}" \
                --url "${DOWNLOAD_URL}" \
                --sha256 "${HASH}" \
                --tarball "${PKG_FILE}" \
                --app "joaju"
            done

            # Commitar manifesto atualizado na Banca
            git config user.name "Joaju Release Bot"
            git config user.email "bot@2lp.in"
            git add site/downloads/joaju/index.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(downloads): rotate joaju release to ${VERSION} (#40)"
              git push origin main || echo "Aviso: Push do manifesto na Banca falhou."
            else
              echo "Manifesto já estava atualizado."
            fi
            cd "$GITHUB_WORKSPACE"
          fi

      - name: "Publish Crate to Canonical Gambi Registry"
        env:
          TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          RAW_TOKEN="${TOKEN#Bearer }"
          if [ -n "$RAW_TOKEN" ]; then
            CANONICAL_VERSION=$(head -n 1 VERSION | tr -d ' \r\n')
            echo "-> Sincronizando Cargo.toml para a versao canonica: $CANONICAL_VERSION"
            sed -i "0,/^version = .*/s//version = \"${CANONICAL_VERSION}\"/" Cargo.toml
            echo "-> Publicando joaju no registry gambi..."
            cargo publish --registry gambi --allow-dirty || echo "::warning::Versao ja publicada ou falha tolerada no registry."
          fi
